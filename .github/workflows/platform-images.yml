name: Stable application publication

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Tested application branch or commit
        required: true
        type: string
      image_run:
        description: Successful Platform images run ID
        required: true
        type: string
      ci_run:
        description: Successful full Release build check run ID for the source SHA
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: stable-application-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: application-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package, publish and verify the tested application archive
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_RUN: ${{ inputs.image_run }}
          CI_RUN: ${{ inputs.ci_run }}
        run: node deployment-artifacts/publish-stable-application.mjs
      - name: Advance the stable application feed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deployment-artifacts/stable-application.json
          git commit -m "deploy: advance verified stable application feed"
          git push origin HEAD:codex/stable-application-feed-20261010
      - uses: actions/upload-artifact@v4
        with:
          name: stable-application-publication
          path: stable-application-publication.json
          if-no-files-found: error
