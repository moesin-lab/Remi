name: Stable application feed repair

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: stable-application-feed-277a43be
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish and verify the already tested application archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: node deployment-artifacts/publish-stable-application.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: stable-application-publication
          path: stable-application-publication.json
          if-no-files-found: error
