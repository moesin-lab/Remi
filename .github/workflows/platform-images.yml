name: Platform application transport

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 277a43bef475b690b13d713cd9175222095f2767
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package the tested x64 application from immutable CI images
        run: |
          set -euo pipefail
          mkdir -p bundle
          cat > bundle/platform-release.json <<'JSON'
          {
            "version": "0.2.88",
            "ref": "277a43bef475b690b13d713cd9175222095f2767",
            "dataSchema": "8cb9f38263f7770f637d7256a4a049c762614d01e816195e4d15a24e1f175aa8",
            "manifestUrl": "https://github.com/moesin-lab/Remi/tree/277a43bef475b690b13d713cd9175222095f2767/platform-release.json",
            "apiImage": "ghcr.io/moesin-lab/remi-api@sha256:32dc56ddb7110f57b206a0fdad77fcbe4f16e495b89e456496ec256272f97d21",
            "webImage": "ghcr.io/moesin-lab/remi-web@sha256:88dbf258f5d0c18387c09b076fcd09f08a2726fc65339036fcc717ae11cddb09"
          }
          JSON
          node --input-type=module <<'JS'
          import {readFileSync, writeFileSync} from 'node:fs';
          const source = readFileSync('scripts/package-platform-application.mjs', 'utf8');
          const architectures = "[['x64', 'amd64'], ['arm64', 'arm64']]";
          if (!source.includes(architectures)) throw new Error('Packaging contract changed');
          writeFileSync('scripts/package-deployment-application.mjs', source.replace(architectures, "[['x64', 'amd64']]"));
          JS
          node scripts/package-deployment-application.mjs bundle/platform-release.json bundle
      - name: Publish the application as an immutable transport layer
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/moesin-lab/remi-api:application-bundle-277a43be-${GITHUB_RUN_ID}"
          mkdir -p transport
          cp bundle/platform-application-v0.2.88-linux-x64.tar.gz transport/
          cat > transport/Dockerfile <<'DOCKERFILE'
          FROM scratch
          LABEL io.remi.artifact.kind="application_bundle"
          LABEL org.opencontainers.image.revision="277a43bef475b690b13d713cd9175222095f2767"
          ADD platform-application-v0.2.88-linux-x64.tar.gz /
          DOCKERFILE
          docker build --provenance=false -t "$IMAGE" transport
          docker push "$IMAGE"
          docker buildx imagetools inspect --raw "$IMAGE" > transport-manifest.json
          jq -e '.layers | length == 1' transport-manifest.json
          jq -e '.layers[0].mediaType | endswith(".tar+gzip") or endswith(".tar.gzip")' transport-manifest.json
          jq --arg image "$IMAGE" '{image: $image, layer: .layers[0]}' transport-manifest.json > application-transport.json
      - uses: actions/upload-artifact@v4
        with:
          name: application-transport-277a43be
          path: |
            application-transport.json
            bundle/platform-release.json
          if-no-files-found: error
          retention-days: 90
