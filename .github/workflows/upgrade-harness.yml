name: Isolated upgrade harness
on:
  pull_request:
    paths:
      - 'tests/**'
      - 'packages/**'
      - 'apps/**'
      - 'deploy/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/upgrade-harness.yml'
  workflow_dispatch:
    inputs:
      release_ref:
        description: Released source ref to rehearse from
        required: true
        default: v0.2.90
permissions:
  contents: read
concurrency:
  group: upgrade-harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Rehearse the PR source SHA and record it, not a synthetic merge SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --registry https://registry.npmjs.org --frozen-lockfile
      - run: bun run test tests/unit/scripts/upgrade-harness-isolation.test.ts tests/arch/upgrade-harness-boundary.test.ts tests/integration/upgrade-harness-recovery.test.ts
      - name: Release to candidate and rollback (real Docker, fake ACP)
        env:
          RELEASE_REF: ${{ inputs.release_ref || 'v0.2.90' }}
        run: bun run tests/integration/upgrade-harness.ts --release-ref="$RELEASE_REF" --output="$RUNNER_TEMP/upgrade-harness-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-harness-evidence
          path: ${{ runner.temp }}/upgrade-harness-results
          if-no-files-found: warn
